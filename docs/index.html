<script>
/* aplica o tema antes da pintura para evitar flash */
(function () {
  var t = null;
  try { t = window.localStorage.getItem('celia-docs-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="icon" type="image/png" href="./assets/celia-icon.png">

<body>
<a class="skip" href="#main" id="skip">Ir para o conteúdo</a>

<header class="top" id="top">
  <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-controls="sidebar" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span class="sr" id="menuLabel">Menu</span>
  </button>
  <a class="brand" id="brand" href="?lang=pt-BR" data-route=""><span class="brand-mark" aria-hidden="true"><img src="./assets/celia-icon.png" alt="Célia" class="brand-img"></span><span class="brand-text" id="brandText">Célia-sama</span></a>
  <nav class="mainnav" id="mainNav" aria-label="Principal"></nav>

  <div class="controls">
    <button class="icon-btn search-btn" id="searchBtn" type="button" aria-controls="searchBox" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="sr" id="searchBtnLabel">Buscar</span>

  <main id="homeMain" tabindex="-1"></main>
</div>

<!-- Documentação: sidebar de grupos + artigo + sumário da seção -->
<div class="shell" id="shell">
  <nav class="side" id="sidebar" aria-label="Documentação"></nav>

  <div class="doc" id="doc">
    <main id="main" tabindex="-1">
      <div id="view">
        <noscript><h1>Célia-sama · Documentação</h1><p>Esta documentação precisa de JavaScript para ser exibida.</p></noscript>
      </div>
    </main>
    <aside class="toc" id="toc" aria-label="Nesta página" hidden>
      <p class="toc-title" id="tocTitle">Nesta página</p>
      <ul id="tocList"></ul>
    </aside>
  </div>
</div>

<footer class="foot" id="footer"></footer>

<div class="sr" id="live" role="status" aria-live="polite"></div>

<script>
/* bootstrap: content.js -> (DOCS preenchido) -> app.js; 2 novas tentativas só em erro de carga (rede/reset) */
(function () {
  var RETRIES = 2;
  var ERROR_TEXT = {
    'pt-BR': ['Não foi possível carregar a documentação', 'Verifique a conexão e tente novamente.', 'Tentar novamente'],
    en: ['Documentation could not load', 'Check your connection and try again.', 'Retry'],
    es: ['No se pudo cargar la documentación', 'Comprueba la conexión e inténtalo de nuevo.', 'Reintentar'],
    ja: ['ドキュメントを読み込めませんでした', '接続を確認して、もう一度お試しください。', '再試行'],
    'zh-CN': ['无法加载文档', '请检查连接后重试。', '重试']
  };
  function fail() {
    var v = document.getElementById('view');
    if (!v) return;
    var language = new URLSearchParams(window.location.search).get('lang');
    if (!Object.prototype.hasOwnProperty.call(ERROR_TEXT, language)) {
      try { language = window.localStorage.getItem('celia-docs-lang'); } catch (e) {}
    }
    if (!Object.prototype.hasOwnProperty.call(ERROR_TEXT, language)) language = 'pt-BR';
    var texts = ERROR_TEXT[language];
    document.documentElement.lang = language;
    v.textContent = '';
    var box = document.createElement('div');
    box.setAttribute('role', 'alert');
    box.style.cssText = 'padding:2rem 1rem;max-width:40rem';
    var h = document.createElement('h1'); h.textContent = texts[0];
    var p = document.createElement('p'); p.textContent = texts[1];
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'btn btn-primary'; b.textContent = texts[2];
    b.addEventListener('click', function () { window.location.reload(); });
    box.appendChild(h); box.appendChild(p); box.appendChild(b);
    v.appendChild(box);
    try { b.focus(); } catch (e) { /* ignore */ }
  }
  function load(src, onOk, onFail, attempt) {
    var s = document.createElement('script');
    s.async = false;
    s.src = attempt ? src + '?retry=' + attempt : src;
    s.onload = function () { onOk(); };
    s.onerror = function () {
      if (s.parentNode) s.parentNode.removeChild(s);
      if (attempt < RETRIES) setTimeout(function () { load(src, onOk, onFail, attempt + 1); }, 250 * (attempt + 1));
      else onFail();
    };
    document.body.appendChild(s);
  }
  function docsReady() {
    var d = window.CELIA_DOCS;
    return !!d && typeof d === 'object' && Object.keys(d).length > 0;
  }
  load('./content.js', function () {
    if (!docsReady()) { fail(); return; }
    load('./app.js', function () {}, fail, 0);
  }, fail, 0);
})();
</script>
</body>
</html>
