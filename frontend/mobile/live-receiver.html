<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Célia — receptor de transmissão</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; color: #fff;
    font: 16px/1.4 system-ui, sans-serif; }
  #celia-video { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; background: #000;
    pointer-events: none; visibility: hidden; }
  body[data-live="1"] #celia-video { visibility: visible; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; text-align: center; padding: 24px; background: #000; }
  body[data-live="1"] #overlay:not([data-audio-blocked]) { display: none; }
  body[data-live="1"] #overlay[data-audio-blocked] { inset: auto 0 24px 0; background: transparent; padding: 0; }
  body[data-live="1"] #overlay[data-audio-blocked] #status { display: none; }
  #status { margin: 0; max-width: 28em; opacity: .85; }
  #status[data-error="1"] { color: #ff9a9a; opacity: 1; }
  #unmute { font: inherit; padding: 12px 22px; border: 0; border-radius: 999px; background: #fff; color: #000; cursor: pointer; }
  /* Compact diagnostic: shown while there is no live video (or with ?diag=1); never on a clean broadcast. */
  #diag { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 5; margin: 0; padding: 4px 6px;
    font: 11px/1.35 ui-monospace, Consolas, monospace; color: #9fd; background: rgba(0,0,0,.72);
    white-space: pre-wrap; overflow-wrap: anywhere; pointer-events: none; display: none; }
  body[data-live="0"] #diag, body[data-diag="1"] #diag { display: block; }
  body[data-diag="1"] #diag { font-size: 36px; line-height: 1.25; overflow-wrap: anywhere; white-space: pre-wrap; }
</style>
</head>
<body data-live="0">
  <video id="celia-video" autoplay playsinline></video>
  <div id="overlay">
    <p id="status" role="status" aria-live="polite">Conectando ao estúdio…</p>
    <button id="unmute" type="button" hidden>Ativar áudio</button>
  </div>
  <pre id="diag" aria-hidden="true"></pre>
  <script src="/live-output/receiver.js"></script>
</body>
</html>
