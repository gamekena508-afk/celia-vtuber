<!doctype html>
<meta charset="utf-8">
<title>prova do gancho de visao</title>
<!--
  Pagina de diagnostico do celia-visao-frame.js. NAO e carregada pelo index.html.
  Prova, sem depender de captura de tela real, que o gancho:
    - acha o painel pela ancora estrutural [role=tabpanel][id$=content-screen]
    - so manda quando ha <video> com trilha viva
    - POSTa em /bridge/vision/frame da MESMA origem (por isso ela mora aqui)
    - fica QUIETO quando o Screen desliga
  Abra em http://127.0.0.1:12393/prova-visao-frame.html
-->
<body style="background:#111;color:#eee;font:14px monospace;padding:16px">
<h3>prova do gancho de visao</h3>
<pre id="saida">rodando...</pre>
<div role="tabpanel" id="radix-x-content-screen" style="opacity:.15">
  <div><div><p>Screen</p></div><div><video id="v" autoplay muted playsinline></video></div></div>
</div>
<script>
(async function () {
  const log = [];
  function diz(m) { log.push(m); document.getElementById("saida").textContent = log.join("\n"); console.log("[PROVA] " + m); }
  const espera = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  const c = document.createElement("canvas"); c.width = 640; c.height = 360;
  const ctx = c.getContext("2d");
  let t = 0;
  setInterval(function () {
    t += 1;
    ctx.fillStyle = "#123"; ctx.fillRect(0, 0, 640, 360);
    ctx.fillStyle = "#fff"; ctx.font = "bold 48px sans-serif";
    ctx.fillText("frame " + t, 40, 200);
  }, 100);
  const fluxo = c.captureStream(10);
  const v = document.getElementById("v");
  v.srcObject = fluxo;
  try { await v.play(); } catch (e) {}
  await espera(500);
  diz("fluxo falso pronto: trilhas=" + fluxo.getVideoTracks().length + " estado=" + fluxo.getVideoTracks()[0].readyState);

  async function idade() {
    const r = await fetch("/bridge/vision/frame");
    if (r.status === 404) return null;
    return (await r.json()).age_ms;
  }
  diz("idade do frame no slot ANTES: " + (await idade()));

  await new Promise(function (ok, erro) {
    const s = document.createElement("script");
    s.src = "/celia-visao-frame.js?prova=" + Date.now();
    s.onload = ok; s.onerror = erro; document.head.appendChild(s);
  });
  diz("script carregado; window.celiaVisaoFrame existe? " + Boolean(window.celiaVisaoFrame));

  await espera(6000);
  const e = window.celiaVisaoFrame.estado();
  diz("estado: " + JSON.stringify({
    painelPresente: e.painelPresente, videoVivo: e.videoVivo, resolucao: e.resolucao,
    enviados: e.enviados, falhas: e.falhas, ultimoBytes: e.ultimoBytes, ultimoErro: e.ultimoErro
  }));
  diz("idade do frame no slot DEPOIS: " + (await idade()) + " ms");

  // Desliga o Screen. Um POST JA EM VOO ainda vai concluir, e isso e legitimo:
  // aquele frame foi capturado enquanto o Screen estava ligado. O que nao pode
  // e continuar CAPTURANDO. Por isso a assercao e sobre estabilizacao, nao
  // sobre o contador nao mexer nunca mais — essa versao rigida reprovou um
  // comportamento correto em 2026-08-27.
  fluxo.getVideoTracks().forEach(function (tr) { tr.stop(); });
  await espera(3000);
  const marca1 = window.celiaVisaoFrame.estado().enviados;
  await espera(5000);
  const depois = window.celiaVisaoFrame.estado();
  diz("apos desligar o Screen: videoVivo=" + depois.videoVivo +
      " | enviados estabilizou em " + marca1 + " -> " + depois.enviados +
      " (tem de ser IGUAL) | falhas=" + depois.falhas);

  const passou = e.painelPresente && e.videoVivo && e.enviados >= 2 && e.falhas === 0 &&
                 depois.videoVivo === false && depois.enviados === marca1;
  diz("VEREDITO: " + (passou ? "PASSOU" : "REPROVOU"));
})();
</script>
