[project]
name = "celia"
version = "1.2.1"
description = "Talk to any LLM with hands-free voice interaction, voice interruption, and Live2D taking face running locally across platforms"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "anthropic>=0.40.0",
    "aiohttp>=3.10.0",
    "azure-cognitiveservices-speech>=1.41.1",
    "chardet>=5.2.0",
    "customtkinter>=5.2.2",
    "discord.py>=2.4.0",
    "edge-tts>=7.0.0",
    "elevenlabs>=1.0.0",
    "fastapi[standard]>=0.115.8",
    "groq>=0.13.0",
    "httpx>=0.28.1",
    "langdetect>=1.0.9",
    "loguru>=0.7.2",
    "mcp[cli]>=1.6.0",
    "numpy>=1.26.4,<2",
    "auditok>=0.5.0,<0.6",
    "webrtcvad-wheels>=2.0.14",
    "num2words>=0.5.14",
    "onnxruntime-gpu==1.20.2",
    "openai>=1.57.4",
    "pre-commit>=4.1.0",
    "pydub>=0.25.1",
    "pysbd>=0.3.4",
    "pytchat>=0.5.5",
    "pytesseract>=0.3.13",
    "pyttsx3>=2.98",
    "pywebview>=5.1",
    "pyyaml>=6.0.2",
    "python-socketio[client]>=5.16.2",
    "requests>=2.32.3",
    "ruamel-yaml>=0.18.10",
    "ruff>=0.8.6",
    "scipy>=1.14.1",
    "sherpa-onnx>=1.10.39",
    "soundfile>=0.12.1",
    "sounddevice>=0.5.2",
    "tomli>=2.2.1",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.6.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch>=2.6.0; sys_platform != 'darwin'",
    "tqdm>=4.67.1",
    "uvicorn[standard]>=0.33.0",
    "websocket-client>=1.8.0",
    "websockets>=12.0",
    "letta-client>=0.1.100",
    "duckduckgo-mcp-server>=0.1.1",
]

[project.optional-dependencies]
bilibili = [
    "aiohttp>=3.10.0",
    "Brotli~=1.1.0",
    "yarl>=1.17.0",
]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.pypi-dependencies]
celia = { path = ".", editable = true }

[tool.pixi.dependencies]
cudnn = ">=8.0,<9"
cudatoolkit = ">=11.0,<12"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Ignore E402 (module level import not at top of file) for the run_bilibili_live.py script
per-file-ignores = { "tools/scripts/run_bilibili_live.py" = ["E402"], "run_desktop.py" = ["E402"], "run_server.py" = ["E402"] }

[tool.pytest.ini_options]
# 2026-08-19 (claude/Kurt): sem isto, tests/test_tools.py falha com
# "async def functions are not natively supported" e a suite fica em 42/43.
asyncio_mode = "auto"
testpaths = ["tests", "integrations/games/tests"]
markers = [
    "real_celia: requires the locally running Célia bridge and Chromium",
    "slow: runs an entire standard game through the local bridge",
]
